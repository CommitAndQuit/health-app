name: Release Debug APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag override (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Auto-generate Release Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | cut -d'"' -f2)
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="v${VERSION:-1.0.0}-debug.r${{ github.run_number }}-${SHORT_SHA}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/biotrace-${{ steps.vars.outputs.tag }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/biotrace-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: biotrace-${{ steps.vars.outputs.tag }}
          path: release-assets/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BioTrace Debug Release ${{ steps.vars.outputs.tag }}
          files: |
            release-assets/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
